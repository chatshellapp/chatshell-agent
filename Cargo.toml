[workspace]
members = [
    "crates/chatshell-agent-core",
    "crates/chatshell-agent-ffi",
]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
async-stream = "0.3"
futures = "0.3"
nanoid = "0.4"
once_cell = "1"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls", "stream"] }
rig-core = { version = "0.32", default-features = false, features = ["reqwest-native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"
tracing = "0.1"
uniffi = "0.32"

[patch.crates-io]
rig-core = { path = "../chatshell-desktop/patches/rig-core" }
