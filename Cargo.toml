[workspace]
members = [
    "crates/chatshell-agent-core",
    "crates/chatshell-agent-ffi",
]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
async-stream = "0.3"
encoding_rs = "0.8"
futures = "0.3"
nanoid = "0.4"
once_cell = "1"
parking_lot = "0.12"
regex = "1"
ab_glyph = "0.2"
png = "0.17"
aes-gcm = "0.10"
base64 = "0.22"
zstd = "0.13"
rand = "0.8"
scraper = "0.18"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "gzip", "deflate", "brotli", "zstd"] }
rig = { version = "0.42", default-features = false, features = ["reqwest", "derive", "agent"] }
rmcp = { version = "2", features = ["client", "transport-streamable-http-client", "transport-streamable-http-client-reqwest"] }
htmd = "0.5"
serde = { version = "1", features = ["derive"] }
readability = { version = "0.3", default-features = false }
serde_json = "1"
url = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "process", "io-util"] }
tokio-util = "0.7"
tracing = "0.1"
urlencoding = "2"
uniffi = "0.32"
unicode-normalization = "0.1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v7"] }

